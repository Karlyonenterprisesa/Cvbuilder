# Decap CMS — Advision CV Builder (administrador: karlyonenterprise@gmail.com)
backend:
  name: github
  repo: Karlyonenterprisesa/Cvbuilder
  branch: branch
  base_url: https://adivisioncvbuilder.vercel.app
  auth_endpoint: api/auth
site_url: https://adivisioncvbuilder.vercel.app
display_url: https://adivisioncvbuilder.vercel.app/vagas
locale: pt
media_folder: img/vagas
public_folder: /img/vagas
collections:
  - name: vagas
    label: Vagas de emprego
    label_singular: Vaga
    folder: content/vagas
    extension: json
    format: json
    create: true
    slug: "{{slug}}"
    summary: "{{titulo}} — {{empresa}}"
    fields:
      - { label: Título da vaga, name: titulo, widget: string }
      - { label: Empresa / Entidade, name: empresa, widget: string }
      - { label: Local, name: local, widget: string, hint: "Ex.: Beira (Sofala)" }
      - { label: Prazo de candidatura, name: prazo, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: Imagem / logótipo (pequena), name: imagem, widget: image, required: false }
      - { label: Resumo (aparece na lista e no Google), name: resumo, widget: text }
      - { label: Descrição completa, name: descricao, widget: text, hint: "Uma linha por parágrafo; use '- ' para listas" }
      - { label: Como candidatar-se, name: como_candidatar, widget: text, required: false }
      - { label: Link de candidatura, name: link_candidatura, widget: string, required: false }
      - { label: Publicado em, name: publicado, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: false }
